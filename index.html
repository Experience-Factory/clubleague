:root{color-scheme:dark;--black:#101212;--panel:#1a1d1e;--line:#2c3033;--text:#f4f5f6;--muted:#9aa1a7;--red:#E30513}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--black);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:3px solid var(--red)}
.top img{height:34px}
.lang{display:flex;gap:4px}
.lang button{font-family:EFB;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.lang button.on{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:520px;margin:0 auto;padding:22px 18px 40px}
.kick{font-family:EFB;font-size:13px;letter-spacing:3px;color:var(--red)}
h1{font-family:EFB;font-size:32px;line-height:1.08;margin:6px 0 10px}
.bar{width:90px;height:6px;background:var(--red);margin:0 0 16px}
p.lead{color:#d6dadd;margin:0 0 22px}
.photo{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:14px;padding:14px;margin-bottom:6px}
.photo canvas{width:96px;height:96px;border-radius:50%;border:4px solid var(--red);background:#000;flex:0 0 96px}
.photo .pb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.photo small{color:var(--muted)}
.btn{font-size:15px;padding:10px 14px;border-radius:10px;border:0;background:#fff;color:#101212;font-weight:700}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input[type=text]{width:100%;font-size:17px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0b0c0c;color:var(--text)}
input[type=text]:focus{outline:2px solid var(--red);border-color:transparent}
#last{text-transform:uppercase}
.at{position:relative}.at::before{content:"@";position:absolute;left:13px;top:12px;color:var(--muted);font-size:17px}.at input{padding-left:32px}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:14px;margin-top:20px;font-size:15px}
.consent input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--red);margin-top:1px}
.send{font-family:EFB;font-size:21px;width:100%;margin-top:22px;padding:16px;border-radius:14px;border:0;background:var(--red);color:#fff}
.send:disabled{opacity:.55}
.err{color:#ff6b73;font-weight:600;margin-top:12px;min-height:1.2em}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.done{text-align:center;padding-top:30px}
.done h1{font-size:40px}
.done a{display:inline-block;margin-top:18px;font-family:EFB;font-size:18px;padding:14px 20px;border-radius:12px;background:#25D366;color:#101212;text-decoration:none}
.hidden{display:none!important}
</style>

let photo = '';
function drawPv(img) {
  pctx.fillStyle = '#000'; pctx.fillRect(0, 0, 192, 192);
  const s = img === helmet ? 1 : Math.max(192 / img.width, 192 / img.height);
  const w = img === helmet ? 192 : img.width * s, h = img === helmet ? 192 : img.height * s;
  pctx.drawImage(img, (192 - w) / 2, (192 - h) / 2 - (img === helmet ? 0 : Math.max(0, (h - 192) * .3)), w, h);
}
helmet.onload = () => { if (!photo) drawPv(helmet); };
document.getElementById('pick').onclick = () => { file.value = ''; file.click(); };
document.getElementById('drop').onclick = () => { photo = ''; drawPv(helmet); document.getElementById('drop').classList.add('hidden'); };
file.addEventListener('change', () => {
  const f = file.files && file.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    photo = c.toDataURL('image/jpeg', .85);
    drawPv(c); document.getElementById('drop').classList.remove('hidden');
    URL.revokeObjectURL(url);
  };
  im.onerror = () => URL.revokeObjectURL(url);
  im.src = url;
});

// envoi (text/plain : pas de requête préalable CORS vers Apps Script)
const $ = id => document.getElementById(id), err = $('err'), send = $('send');
send.onclick = async () => {
  err.textContent = '';
  const d = { first: $('first').value.trim(), last: $('last').value.trim(), ig: $('ig').value.trim(),
              consent: $('ok').checked, photo, website: $('website').value, lang: L };
  if (!d.first || !d.last || !d.consent) { err.textContent = T[L].errMissing; return; }
  send.disabled = true; send.textContent = T[L].sending;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(d) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'ko');
    $('formView').classList.add('hidden'); $('doneView').classList.remove('hidden'); window.scrollTo(0, 0);
  } catch (e) {
    err.textContent = T[L].errNet;
  } finally { send.disabled = false; send.textContent = T[L].send; }
};
